main: "jp.jyn.jecon.Jecon"
name: "Jecon"
version: "${version}"
website: "${url}"
author: "HimaJyun( https://jyn.jp/ )"
description: "${description}"
load: "STARTUP"
loadbefore: ["Vault", "VaultUnlocked"]
api-version: "1.21"

permissions:
  jecon.*:
    children:
      jecon.show: true
      jecon.pay: true
      jecon.show.other: true
      jecon.set: true
      jecon.give: true
      jecon.take: true
      jecon.create: true
      jecon.remove: true
      jecon.top: true
      jecon.convert: true
      jecon.reload: true
      jecon.version: true
      jecon.account: true
      jecon.transfer.overdraft: true
      jecon.viewnonplayer: true
  jecon.user:
    children:
      jecon.show: true
      jecon.pay: true
  jecon.op:
    children:
      jecon.show.other: true
      jecon.set: true
      jecon.give: true
      jecon.take: true
      jecon.create: true
      jecon.remove: true
      jecon.top: true
      jecon.convert: true
      jecon.reload: true
      jecon.version: true
      jecon.account: true
      jecon.transfer.overdraft: true
      jecon.viewnonplayer: true
  jecon.show:
    default: true
  jecon.pay:
    default: true
  jecon.show.other:
    default: op
  jecon.set:
    default: op
  jecon.give:
    default: op
  jecon.take:
    default: op
  jecon.create:
    default: op
  jecon.remove:
    default: op
  jecon.top:
    default: op
  jecon.convert:
    default: op
  jecon.reload:
    default: op
  jecon.version:
    default: op
  jecon.account:
    default: op
    description: "Base permission for /jecon account subcommands (grant per-namespace via jecon.account.namespace.<namespace>.create / .transfer)"
  jecon.transfer.overdraft:
    default: op
    description: "Allow --overdraft on /jecon account send"
  jecon.viewnonplayer:
    default: op
    description: "Bypass the hideNonPlayerAccounts filter (see non-player accounts in /money top and <player> tab completion)"
