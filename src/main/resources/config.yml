defaultBalance: 10000.0
createAccountOnJoin: true

# Message locale. (en/ja)
# Loads message_<locale>.yml from the plugin folder.
# If message.yml exists in the plugin folder (from a legacy install
# or manual customization), that file takes priority instead.
locale: en

# Transaction logging: record all balance changes to transaction_log table.
transactionLog: true

# Hide non-player accounts (e.g. system/shop accounts registered via
# `/jecon account create <namespace>:<key>`) from `/money top` output
# and from `<player>` argument tab completion.
# Players with `jecon.viewnonplayer` bypass this filter.
hideNonPlayerAccounts: true

format:
  singularMajor: "dollar"
  pluralMajor: "dollars"
  singularMinor: "cent"
  pluralMinor: "cents"
  format: "{major} {majorcurrency} {minor} {minorcurrency}"
  # Example:
  #format: "$ {major}.{minor}"
  #format: "{major}円"
  # Optional
  #formatZeroMinor: "{major} {majorcurrency}"
  minorType: asis # omit/accurate/asis
  # Hint:
  # omit: 1.02 -> 1.02, 3.40 -> 3.4
  # accurate: 1.02 -> 1.02, 3.40 -> 3.40
  # asis: 1.02 -> 1.2, 3.40 -> 3.40
  #   omit or accurate for number style format (eg: 1.02 -> $ 1.02, 3.40 -> $ 3.4 / $ 3.40)
  #   asis for text style format (eg: 1.02 -> 1 dollar 2 cents, 3.40 -> 3 dollars 40 cents)

database:
  # Database type. (sqlite/mysql)
  type: sqlite
  sqlite:
    file: "jecon.db"
    # Executed on every new pooled connection. The default sets a busy timeout
    # so that concurrent writers wait for each other instead of failing.
    # Jecon also switches the database to WAL mode on startup, and starts every
    # write transaction with BEGIN IMMEDIATE (a deferred BEGIN would have to
    # upgrade a read lock to a write lock, which SQLite fails immediately
    # without honouring the busy timeout).
    #init: "PRAGMA busy_timeout=5000"
  mysql:
    host: "localhost:3306"
    name: "jecon"
    username: "root"
    password: "your_mysql_password"
    # Executed on every new pooled connection.
    # NOTE: do not put "SET SESSION query_cache_type=0" here. The query cache was
    # removed in MySQL 8.0, so that statement fails with "Unknown system variable",
    # and a failing init statement makes the connection pool refuse to start.
    init: "/* Jecon */SELECT 1"
    properties:
      "useSSL": "false"
      # encoding
      #"useUnicode": "true"
      #"characterEncoding": "UTF-8"
      #"characterSetResults": "UTF-8"
      # performance
      "maintainTimeStats": "false"
      "elideSetAutoCommits": "true"
      "useLocalSessionState": "true"
      "alwaysSendSetIsolation": "false"
      "cacheServerConfiguration": "true"
      "cachePrepStmts": "true"
      "prepStmtCacheSize": "250"
      "prepStmtCacheSqlLimit": "2048"
      #"useServerPrepStmts": "true"
  connectionPool:
    # -1 is default
    maximumPoolSize: -1
    minimumIdle: -1
    maxLifetime: -1
    connectionTimeout: -1
    idleTimeout: -1

# Don't touch
version: 8
